name: Build Doshi Crafts Demo

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          # The project may be uploaded as a ZIP, so extract it first when needed.
          if [[ ! -f "settings.gradle.kts" ]]; then
            shopt -s nullglob
            zips=( *.zip )
            if (( ${#zips[@]} == 0 )); then
              echo "ERROR: No Android project and no ZIP file found in repository root."
              find . -maxdepth 3 -type f | sort | head -200
              exit 1
            fi

            mkdir -p .android-project
            unzip -q -o "${zips[0]}" -d .android-project
          fi

          # Locate the directory containing the Android project.
          PROJECT_DIR="$(find . -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [[ -z "${PROJECT_DIR}" ]]; then
            echo "ERROR: settings.gradle.kts was not found after ZIP extraction."
            find . -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR="$(cd "${PROJECT_DIR}" && pwd)"
          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"
          echo "Android project: ${PROJECT_DIR}"

          test -f "${PROJECT_DIR}/settings.gradle.kts"
          test -f "${PROJECT_DIR}/app/build.gradle.kts"
          test -f "${PROJECT_DIR}/app/src/main/AndroidManifest.xml"
          test -f "${PROJECT_DIR}/app/src/main/java/com/doshicrafts/demo/MainActivity.kt"
          test -f "${PROJECT_DIR}/app/src/main/assets/site/index.html"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate Gradle project
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --version

      - name: Compile Kotlin
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:lintDebug --stacktrace

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK created: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doshi-Crafts-Demo-v0.1.0-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error