name: Build Doshi Crafts Demo

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "settings.gradle.kts" ]]; then
            shopt -s nullglob
            zips=( *.zip )

            if (( ${#zips[@]} == 0 )); then
              echo "ERROR: No Android project or ZIP found."
              find . -maxdepth 5 -type f | sort | head -400
              exit 1
            fi

            rm -rf .android-project
            mkdir -p .android-project
            unzip -q -o "${zips[0]}" -d .android-project
          fi

          PROJECT_DIR="$(find . -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"

          if [[ -z "${PROJECT_DIR}" ]]; then
            echo "ERROR: settings.gradle.kts not found."
            find . -maxdepth 7 -type f | sort | head -500
            exit 1
          fi

          PROJECT_DIR="$(cd "${PROJECT_DIR}" && pwd)"
          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"
          echo "Android project: ${PROJECT_DIR}"

          test -f "${PROJECT_DIR}/settings.gradle.kts"
          test -f "${PROJECT_DIR}/app/build.gradle.kts"
          test -f "${PROJECT_DIR}/app/src/main/AndroidManifest.xml"
          test -f "${PROJECT_DIR}/app/src/main/assets/site/index.html"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi

          if [[ -z "${SDKMANAGER}" || ! -x "${SDKMANAGER}" ]]; then
            echo "ERROR: sdkmanager not found."
            find "${ANDROID_HOME}" -maxdepth 4 -type f -name sdkmanager -print
            exit 1
          fi

          echo "Using sdkmanager: ${SDKMANAGER}"

          yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true

          "${SDKMANAGER}" "platform-tools"
          "${SDKMANAGER}" "platforms;android-35"
          "${SDKMANAGER}" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --version

      - name: Compile
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:compileDebugKotlin --stacktrace

      - name: Unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:lintDebug --stacktrace

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "${APK}" ]]; then
            echo "ERROR: APK was not created."
            find "${PROJECT_DIR}/app/build/outputs" \
              -type f -maxdepth 6 -print 2>/dev/null || true
            exit 1
          fi

          ls -lh "${APK}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Doshi-Crafts-Demo-v0.1.0-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14